name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pin Hurl explicitly — release assets are version-named
  # (``hurl_<version>_amd64.deb``); the bare ``hurl_amd64.deb`` URL 404s.
  HURL_VERSION: 8.0.1

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Dependency audit (pip-audit — known CVEs in the resolved env)
        run: uv run pip-audit

      - name: Pre-commit (ruff, ruff-format, bandit, file hygiene, uv lock --check)
        run: uv run pre-commit run --all-files

      - name: Typecheck
        run: uv run pyright

      - name: Pytest (unit + integration + contract, coverage gate)
        run: uv run pytest

      - name: Schemathesis (property-based OpenAPI tests, ASGI in-process)
        run: make schemathesis

      - name: Install Hurl
        run: |
          set -euo pipefail
          curl -fsSLo hurl.deb \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo dpkg -i hurl.deb
          hurl --version

      - name: Hurl E2E suite (--jobs 1 — sequential scenario isolation)
        run: make hurl-e2e

      - name: Upload Hurl HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hurl-reports
          path: reports/hurl/
          if-no-files-found: warn

  migrations:
    # Alembic owns the production schema, but the pytest suite builds its schema from
    # SQLModel.metadata (create_all) — so a migration that drifts from the models would
    # never be caught by tests. This job builds the schema the way prod does and gates on drift.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskservice
          POSTGRES_PASSWORD: taskservice
          POSTGRES_DB: taskservice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskservice -d taskservice"
          --health-interval 3s --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://taskservice:taskservice@localhost:5432/taskservice
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Apply migrations (build the schema from migrations, as prod does)
        run: uv run alembic upgrade head

      - name: Drift gate — models must match migrations
        run: uv run alembic check

      - name: Migration round-trip (downgrade to base, then re-upgrade)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build -f docker/Dockerfile -t internal-task-service:ci .

      - name: Trivy image scan (OS + installed packages)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: internal-task-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy filesystem scan (project dependencies + config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
