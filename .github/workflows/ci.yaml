name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Nothing here writes to the repository, comments on a
# pull request, or publishes a package — the jobs check out, test, scan, and upload an
# artifact. Declaring it at the workflow level means a job added later cannot silently
# inherit whatever the repository default happens to be.
permissions:
  contents: read

# One in-flight run per PR, superseded on push — a PR only needs a verdict on its latest commit.
# Pushes group per commit instead: work lands on main directly, so each landed commit keeps its own
# verdict. (``cancel-in-progress: false`` on a shared group would not achieve that — GitHub holds at
# most one *pending* run per group, so a third push cancels the second.) Each ternary branch is
# already unique to its event, since a PR ref is never a SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pin Hurl explicitly — release assets are version-named
  # (``hurl_<version>_amd64.deb``); the bare ``hurl_amd64.deb`` URL 404s.
  HURL_VERSION: 8.0.1

# The gates below are mutually independent, so they run as separate jobs rather than as steps in
# one. Measured on a green run, the combined job was 172s of strictly serial work — pytest 47s,
# schemathesis 60s and Hurl 34s waiting on each other for no reason — against a ~67s critical path
# split up. Each job re-pays ~6s of checkout and dependency sync, which on a public repo costs
# nothing but wall clock already saved several times over. They deliberately do not ``needs:`` the
# static gates: a lint failure should not withhold the test verdict when a runner is free anyway.
jobs:
  static:
    # No ``APP_ENV`` here, unlike the pytest jobs: nothing in this job executes application code.
    # ``pip-audit`` inspects the resolved environment, the pre-commit hooks are ruff/bandit/hygiene,
    # and pyright is static analysis — none of them instantiate ``Settings``.
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Dependency audit (pip-audit — known CVEs in the resolved env)
        run: uv run pip-audit

      - name: Pre-commit (ruff, ruff-format, bandit, file hygiene, uv lock --check)
        run: uv run pre-commit run --all-files

      - name: Typecheck
        run: uv run pyright

  pytest:
    name: Pytest (unit + integration + contract)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Pytest (coverage gate)
        run: uv run pytest

  schemathesis:
    name: Schemathesis (property-based OpenAPI)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Schemathesis (ASGI in-process)
        run: make schemathesis

  hurl:
    # No uv and no dependency sync: this suite is ``docker compose`` plus the ``hurl`` binary, and
    # the container carries its own ``APP_ENV=prod`` baked in by the Dockerfile. Syncing the project
    # environment here would install ~65 wheels nothing in this job runs.
    name: Hurl E2E (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Hurl
        run: |
          set -euo pipefail
          curl -fsSLo hurl.deb \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo dpkg -i hurl.deb
          hurl --version

      - name: Hurl E2E suite (--jobs 1 — sequential scenario isolation)
        run: make hurl-e2e

      - name: Upload Hurl HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hurl-reports
          path: reports/hurl/
          if-no-files-found: warn

  migrations:
    # Alembic owns the production schema, but the pytest suite builds its schema from
    # SQLModel.metadata (create_all) — so a migration that drifts from the models would
    # never be caught by tests. This job builds the schema the way prod does and runs
    # ``alembic check``, which compares tables and columns but *not* partial-index predicates
    # (verified: a changed ``postgresql_where`` still reports "No new upgrade operations
    # detected"). Predicates are gated by tests/integration/core/test_migration_drift.py.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskservice
          POSTGRES_PASSWORD: taskservice
          POSTGRES_DB: taskservice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskservice -d taskservice"
          --health-interval 3s --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://taskservice:taskservice@localhost:5432/taskservice
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Runtime deps only: alembic/env.py needs the models and settings, nothing from the dev
      # group — syncing all groups pulls ~65 extra wheels to run four alembic commands.
      - name: Sync dependencies
        run: uv sync --no-dev

      - name: Drift gate — apply migrations, then models must match them
        run: make migrate-check

      - name: Migration round-trip (downgrade to base, then re-upgrade)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  security-scan:
    # ``trivy-action`` tags carry a ``v`` prefix — ``@0.28.0`` (without it) resolves to nothing and
    # GitHub fails the job in ~3s before any step runs, which reads like a flake rather than a
    # scanner that never scanned. Keep the ``v``.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build -f docker/Dockerfile -t internal-task-service:ci .

      - name: Trivy image scan (OS + installed packages)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: internal-task-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy filesystem scan (project dependencies + config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
