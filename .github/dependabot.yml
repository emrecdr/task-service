version: 2
updates:
  # Python runtime + dev dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-deps:
        patterns: ["*"]

  # GitHub Actions used by the CI workflow (keeps action tags/digests fresh).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image referenced by docker/Dockerfile; keeps the pinned digest current.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
