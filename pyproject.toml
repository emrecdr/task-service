[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-service"
dynamic = ["version"]
description = "Task Service."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.1",
    "uvicorn[standard]>=0.52.1",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31",
    "alembic>=1.13",
    "pydantic>=2.13",
    "pydantic-settings>=2.1",
    "structlog>=25.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.6",
    "bandit[toml]>=1.9.4",
    "pre-commit>=4.0",
    "schemathesis>=3.30",
    "pyright>=1.1.411",
    "pip-audit>=2.10.1",
]

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "app/services/**/tests"]
skips = ["B101"]
severity = "medium"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
src = ["app", "tests"] # Explicitly include app and tests
fix = true
exclude = [
    "alembic",
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    # Plugin / harness state directories — not project source
    ".devt",
    ".planning",
    ".claude",
    "graphify-out",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "W",       # pycodestyle warnings
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "T20",     # flake8-print
    "PLC0415", # import-outside-top-level (enforces CLAUDE.md "no inline imports")
]
ignore = [
    "B008", # FastAPI uses ``Depends(...)`` / ``Query(...)`` as default values
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]       # re-exports are valid here
"tests/conftest.py" = ["E402"] # APP_ENV must be set BEFORE app imports

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One shared event loop so async fixtures and tests share a greenlet context
# (a repo/session yielded by a fixture is used in the test without MissingGreenlet).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/services", "tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib --cov=app --cov-report=term --cov-fail-under=80 -m 'not e2e'"
markers = [
    "unit: pure in-module tests",
    "integration: FastAPI app + repo, in-process",
    "contract: port-conformance tests",
    "e2e: opt-in Schemathesis property tests (ASGI in-process); excluded from default runs",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/main.py",   # bootstrap; covered transitively by integration tests
    "*/__init__.py", # almost always empty package markers
    "*/tests/*",     # don't measure test files against themselves
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
